# The group that may reach /run/bacchus/netd.sock.
#
# Membership of this group is a PACKAGING decision and is deliberately not the
# security check — ADR-0049 §3.1 is explicit that "a uid that merely belongs to
# the bacchus group is not enough on a multi-user machine". The helper reads
# SO_PEERCRED on every connection and asks logind whether that uid owns an
# active local session; the group only decides who may knock.
#
# Install with:  systemd-sysusers deploy/bacchus-netd.sysusers.conf
# or by hand:    groupadd --system bacchus && usermod -aG bacchus <user>
#
# A user added here must log out and back in before the membership takes
# effect — a running session's supplementary groups are fixed at login, and
# "I added myself to the group and it still says the helper is unreachable" is
# otherwise a confusing first experience.
g bacchus -
