name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      # clients/internal/... is in this job rather than one of the two client
      # jobs on purpose: it is the OS enforcement layer (ADR-0039's seam), it
      # needs no GUI toolchain and no cgo, and until bacchus#59 moved
      # ~1,300 lines into it, it was covered by NO job at all — this one
      # excluded ./clients/..., the linux-client job runs only
      # ./clients/fyne/..., and windows-client only built ./clients/windows.
      # Its Windows-tagged half is covered by the windows-client job below.
      - name: vet
        run: go vet ./core/... ./bind/... ./cmd/... ./clients/internal/...
      - name: build
        run: go build ./cmd/...
      # Deliberately no -short: a few real-transport integration tests are
      # gated behind testing.Short() specifically so they still run here
      # while a local `go test -short ./...` skips them for a fast inner
      # loop — core/dtls_fingerprint_test.go's real WebRTC/DTLS handshakes
      # and cmd/node/midsession_recovery_test.go's ~94s real mid-session
      # mesh-walk recovery (issue #131). Adding -short to this step would
      # silently stop covering both; if CI runtime ever needs to come down,
      # split those into their own non-short job instead of short-circuiting
      # this one.
      # cmd/bacchus-netd drives a REAL kernel: its tests re-exec themselves
      # inside a user + network namespace and assert against actual routing,
      # nftables and TUN state (ADR-0049's testing section). Two things it
      # needs that a bare runner may not have:
      #
      #   - iproute2 and nftables, used only to BUILD fixtures and to READ the
      #     results back. The helper itself never shells out — ADR-0049 §4
      #     forbids it — but a test asserting against `nft list ruleset` is
      #     checking its own encoding against nftables' own renderer, which is
      #     a stronger check than re-reading its own bytes.
      #   - unprivileged user namespaces, which is how an unelevated CI job gets
      #     CAP_NET_ADMIN over an isolated stack.
      - name: install namespace test tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 nftables uidmap
      # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, an
      # AppArmor restriction that blocks unprivileged user namespaces for
      # unconfined binaries — which is exactly what a `go test` process is. The
      # runner is a disposable VM and this is the documented knob for it.
      # Tolerant of the sysctl being absent: older images and non-Ubuntu bases
      # do not have it, and there it is not needed.
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
      - name: confirm unprivileged user namespaces work
        run: |
          if ! unshare -Ur --net true; then
            echo "::error::this runner cannot create user+network namespaces, so the"
            echo "::error::bacchus-netd kernel tests would all skip and this job would go"
            echo "::error::green over nothing. Relevant knobs:"
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            sysctl kernel.unprivileged_userns_clone 2>&1 || true
            sysctl user.max_user_namespaces 2>&1 || true
            exit 1
          fi
      # BACCHUS_NETD_REQUIRE_NS turns a missing-namespace SKIP into a failure.
      # Without it, a runner that lost this capability would report a green job
      # over the only real-kernel coverage this repo has, which reads as
      # "verified" while verifying nothing.
      - name: test
        env:
          BACCHUS_NETD_REQUIRE_NS: "1"
        run: go test ./core/... ./bind/... ./cmd/... ./clients/internal/...

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        run: go build ./clients/windows
      # The enforcement layer's Windows half (routes_windows.go,
      # killswitch_windows.go, enforcement_windows.go) exists only under this
      # GOOS, so this is the only runner that can compile — let alone run —
      # its tests. Until bacchus#59 this job did neither: it built one package
      # and stopped, which meant every Windows-only guarantee in the routing
      # and kill-switch code was checked by nothing on any push.
      #
      # None of these need Administrator. They drive the real cmdlet sequences
      # through an injected runner (winOS.run) and assert ordering — allow
      # rules before the default flips to Block, nothing left half-armed on a
      # failure, a crashed session's prior state restored from the marker
      # rule. What they deliberately do NOT assert is that Windows honours
      # those cmdlets — that the route table really hands the TUN device this
      # machine's traffic, and that a DefaultOutboundAction Block really keeps
      # blocking after the process is killed. Those are OS guarantees, they
      # need an elevated machine, and no result from this job is evidence
      # about them in either direction.
      #
      # That run has since happened: issue #88, 2026-08-02, elevated, both
      # guarantees confirmed — recorded in ADR-0039's amendment of that date.
      # This comment used to call the run OUTSTANDING, which is the only part
      # of it that changed; the sentence above still holds, because what
      # covers those two guarantees is a hardware run and not this job.
      #
      # The run used clients/windows, which is the binary built above. The
      # other caller of the same enforcement package is clients/fyne, and it
      # is built by windows-fyne-client below — built, not run, so the same
      # limit applies there and more of it (issue #115).
      - name: vet
        run: go vet ./clients/windows ./clients/internal/...
      - name: test
        run: go test ./clients/internal/...

  windows-fyne-client:
    # clients/fyne, built for Windows (issue #115) — the platform it is meant
    # to replace a client ON, and the one nothing had ever built it for.
    #
    # Neither existing job covers this. windows-client builds clients/windows,
    # which is pure Go/syscall and shares no build requirement with this
    # package; linux-client builds clients/fyne against a completely different
    # C toolchain. And a C toolchain is the whole point: clients/fyne is the
    # only package in this repo that needs one, because Fyne's desktop driver
    # renders through OpenGL via cgo (go-gl/gl, go-gl/glfw — ADR-0039's "new
    # build prerequisite"). So the one client that could plausibly fail to
    # build on Windows was the one nothing built on Windows.
    #
    # A separate job rather than a step on windows-client, for the reason
    # linux-client is separate from server: windows-client is the fast,
    # toolchain-free signal for the shared enforcement layer, and a mingw or
    # GL failure should neither red that out nor hide behind it. The two run
    # in parallel, so this costs no wall-clock, and the repo is public, so the
    # extra Windows runner costs no billed minutes.
    #
    # The measured numbers, from the first run of this job: 8m12s here against
    # 1m17s for windows-client. Folding this in as a step would have taken the
    # enforcement layer's only Windows signal from 1m17s to roughly nine
    # minutes on every push. Nearly all of that is cgo compiling go-gl/glfw,
    # so it is inherent to the target rather than something to tune away.
    runs-on: windows-latest
    env:
      # Pinned rather than inherited. See "confirm the toolchain" below for
      # why 0 is the dangerous value here and not merely the wrong one.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # clients/fyne/README.md's Build section states the requirement as a
      # mingw-w64 GCC on PATH as `gcc`. Locate one rather than hardcode a
      # path: these runner images move mingw between releases, and the image
      # is not something this repo pins.
      #
      # As of 2026-08-02 windows-latest ships one already on PATH
      # (C:\mingw64\bin, MinGW-Builds 15.2.0), so the first branch below is
      # what runs and the install costs nothing. The other branches are kept
      # precisely because that is an image detail nobody here controls, and
      # its disappearance should cost one step rather than a red job nobody
      # can read.
      - name: ensure a mingw-w64 gcc
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            "gcc already on PATH: $((Get-Command gcc).Source)"
            exit 0
          }
          $dirs = @(
            "C:\msys64\mingw64\bin",
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          )
          $dir = $dirs | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if ($dir) {
            "preinstalled toolchain at $dir"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            exit 0
          }
          "no preinstalled mingw-w64 on this image; installing one"
          choco install mingw --no-progress --yes
          # Chocolatey's shim directory is already on PATH for later steps, so
          # a successful install needs nothing more here. The next step is the
          # gate either way: it fails loudly if this left no usable compiler.
      - name: confirm the toolchain
        shell: pwsh
        run: |
          gcc --version
          if ($LASTEXITCODE -ne 0) { throw "no working mingw-w64 gcc on PATH - see the step above" }
          # CGO_ENABLED=0 is the one setting that would make this whole job
          # theatre, and it does not announce itself as a missing compiler:
          # with cgo off, go-gl's files are excluded by build constraints and
          # the error names a package no reader connects to "you have no C
          # compiler". ADR-0039 records both forms of that failure verbatim.
          $cgo = go env CGO_ENABLED
          if ($cgo -ne "1") { throw "CGO_ENABLED=$cgo - this job only means anything at 1" }
          "CGO_ENABLED=$cgo CC=$(go env CC)"
      - name: vet
        run: go vet ./clients/fyne/...
      # -H=windowsgui is the form clients/fyne/README.md documents for the
      # shipping binary (no console window behind the GUI). It sets one PE
      # header field and changes no compilation - but building something other
      # than what ships is how a green job stops describing the artifact.
      - name: build
        run: go build -ldflags "-H=windowsgui" -o bacchus-fyne.exe ./clients/fyne
      - name: confirm the build produced a real Windows binary
        shell: pwsh
        run: |
          if (-not (Test-Path bacchus-fyne.exe)) { throw "no bacchus-fyne.exe - the build step produced nothing" }
          $f = Get-Item bacchus-fyne.exe
          "bacchus-fyne.exe: $([math]::Round($f.Length / 1MB, 1)) MB"
          # A Fyne binary with the GL stack linked in is tens of megabytes.
          # A few hundred KB would mean something got stubbed out - which is
          # the failure this job exists to catch, so it must not be the one
          # thing the job takes on trust.
          if ($f.Length -lt 5MB) { throw "bacchus-fyne.exe is only $($f.Length) bytes - too small to have the GL stack linked in" }
          $mz = Get-Content bacchus-fyne.exe -AsByteStream -TotalCount 2
          if (($mz[0] -ne 0x4D) -or ($mz[1] -ne 0x5A)) { throw "bacchus-fyne.exe is not a PE image" }
      # internal/appstate holds the real tests and is Fyne-free, so most of
      # this needs no toolchain - but two things here run on Windows for the
      # first time. autostart_windows.go's registry Run key is exercised by
      # autostart_windows_test.go, which is behind //go:build windows and so
      # has been compiled by nothing until now; and the outer package's
      # translations_test.go (#93) links the whole GL stack into a test
      # binary, which is a stronger check than the build step alone. It walks
      # its own AST and creates no fyne.App, so it needs no display.
      - name: test
        run: go test ./clients/fyne/...
      # The binary #115's second item needs. That item is a hardware pass on
      # the owner's own machine, and without this it would begin by installing
      # a mingw toolchain to produce a binary CI already had. Unsigned - this
      # is a test artifact, not a release (Windows signing identity is its own
      # open question).
      - name: upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: bacchus-fyne-windows-amd64
          path: bacchus-fyne.exe
          if-no-files-found: error

  linux-client:
    # The Linux GUI build target (issue #153): clients/fyne is the first
    # package in the repo needing a C toolchain (Fyne's desktop driver is
    # go-gl/glfw, both cgo) — see ADR-0039's "new build prerequisite"
    # section, which proved this exact package list by hand in a disposable
    # Docker container before this job existed. Encoded here so that proof
    # runs on every push instead of living only in that one-time record.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install GUI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: gofmt
        run: test -z "$(gofmt -l clients/fyne)"
      - name: vet
        run: go vet ./clients/fyne/...
      - name: build
        run: go build -o /tmp/bacchus-fyne ./clients/fyne
      # internal/appstate is deliberately Fyne-free (ADR-0039) and needs no
      # display; the outer package (main.go/settings.go/ui.go) has no test
      # files of its own, so this compiles it under the real cgo/GL
      # toolchain above without needing Xvfb just to run `go test`.
      - name: test
        run: go test ./clients/fyne/...
      # Compiling is not proof it runs (ADR-0039 makes exactly this point
      # about the earlier ephemeral-SOCKS-port bug: "the tunnel came up...
      # 100% of traffic went out in the clear" while every build-time check
      # stayed green). Launch the real binary under a virtual display and
      # confirm it survives past startup, with no config file present -
      # the common fresh-install case (main.go treats a missing config as
      # a normal empty state, not a startup error).
      # xauth is a "Recommended", not "Depends", package of xvfb on Debian -
      # --no-install-recommends (used above for the GUI toolchain) silently
      # drops it, and xvfb-run hard-requires it ("xauth command not found",
      # confirmed by hand): list it explicitly rather than dropping the flag
      # and pulling in everything else xvfb recommends.
      - name: install Xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: smoke test (headless launch)
        run: |
          xvfb-run --auto-servernum /tmp/bacchus-fyne &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "bacchus-fyne exited before the 5s mark - see above for output"
            exit 1
          fi
          kill "$APP_PID"
