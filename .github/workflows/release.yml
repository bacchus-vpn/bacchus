name: release

# The Windows release artifacts (bacchus-vpn/bacchus#136): a portable zip and
# an installer, built from one staging directory by
# deploy/windows/build-bundle.ps1. That script owns the packaging; this file
# owns when it runs, what version it is told to build, and what happens to the
# result. Keeping the packaging in a script is deliberate - see its header.
#
# READ THIS BEFORE TRUSTING A GREEN RUN OF THIS FILE.
#
# A tag-triggered workflow cannot be exercised by any run on a branch. Nothing
# on a pull request can prove that the publish half works, because the publish
# half only ever runs on a tag push, and its first execution will therefore be
# during a real release. Two things are done about that here:
#
#   - the build half runs on pull requests that touch it, and on manual
#     dispatch, so the part with all the moving pieces (toolchain, the wintun
#     download and its hash, the Inno Setup compile, the layout assertions) is
#     rehearsed for real before any tag exists;
#   - the publish half is small, sits in its own job, and creates the release
#     as a DRAFT, so the first real execution of the untested path is
#     recoverable rather than public.
#
# Removing --draft is a one-line change to make once a release has gone
# through this end to end. Do not remove it before that.
#
# The order of the jobs is the load-bearing part of the file:
#
#   verify-version  --+
#                     +-->  windows-bundle  ->  publish
#   verify-table    --+
#
# so a refusal at either gate happens BEFORE the build. Nothing is compiled, no
# artifact is uploaded, and no release object is created, not even a draft. That
# is the difference between "the draft was created and then a check went red"
# and "nothing was created", and it is why both gates are jobs here rather than
# steps somewhere later.
#
# The two gates run in parallel with each other because neither orders the
# other: one is about the tag, one is about the bytes being shipped. What
# matters is that windows-bundle needs BOTH.

on:
  push:
    tags:
      # Both spellings: the tag may or may not carry a leading v, and this
      # workflow derives the version from whichever form arrives rather than
      # legislating one here.
      - 'v[0-9]*'
      - '[0-9]*'
  # A dry run from any branch: builds and uploads both artifacts as workflow
  # artifacts and publishes nothing. This is the only way to exercise the
  # packaging without cutting a tag.
  workflow_dispatch:
  # Same dry run, automatically, for changes to the release path itself. Path
  # filtered: every other pull request is ci.yml's business and this costs it
  # nothing.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'deploy/windows/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: one of these runs can be an actual release.
  cancel-in-progress: false

jobs:
  # The first of two gates. Nothing else in this file runs until both pass.
  #
  # ci.yml asserts the same thing on a tag push, and that assertion is a
  # BYSTANDER: two workflows triggered by one push start in parallel, and there
  # is no native way to order them (needs: is intra-workflow, workflow_run is a
  # different tool for a different problem). So its check can go red beside a
  # bundle that has already been built and a release that has already been
  # created. A check that cannot stop the thing it is checking gates nothing.
  #
  # Here it is a precondition instead, because windows-bundle needs: it and
  # publish needs: windows-bundle. A refusal means nothing is built, no artifact
  # exists, and no release object is created - not even a draft.
  #
  # This is NOT the same check as the version rule in windows-bundle below, and
  # neither covers the other. That one validates the tag's SHAPE - that
  # MAJOR.MINOR.PATCH can be read out of it at all, which is what
  # core/version.current needs. This one validates that the tag EQUALS the
  # version the repository claims. A tag v1.5.0 pushed while VERSION still says
  # 1.0.0 passes the shape check cleanly, builds an internally consistent 1.5.0
  # bundle, and publishes a release the repository does not know about.
  #
  # The duplication with ci.yml is deliberate and stays: its copy covers
  # somebody tagging without cutting a release, which this file never sees.
  #
  # TWO assertions about the tag, in two steps: what it SAYS (the version) and
  # where it POINTS (a commit main contains). They are unrelated failures and
  # each names its own.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing here, not tidiness, and it is the reason
      # this checkout has a `with:` while the other two in this file do not.
      #
      # actions/checkout defaults to depth 1 and, on a tag push, fetches only
      # the tagged commit - no branches at all, so no origin/main. The ancestry
      # step below cannot be answered from that, and the way it FAILS to be
      # answered is the trap: git does not say "I cannot tell", it errors on a
      # missing origin/main and, given a truncated one, reports "not an
      # ancestor" about a commit that is one. Both directions of that are wrong
      # and only one of them is loud.
      #
      # The cost was measured rather than feared, because ADR-0044's second
      # amendment section 7 says this repository carries ~3.14 MB of committed
      # table per refresh and git cannot delta a gzip, so "full history" sounds
      # expensive here. It is not: a fresh clone of this repository is 5.9 MB
      # packed at full depth against 5.4 MB at depth 1 - about half a megabyte
      # over 65 commits, because the table blob is in the depth-1 clone too.
      # That is one ubuntu job on a rare event, and it is not a number worth
      # trading a correct answer for. Re-measure it if the history ever gets
      # long enough for the question to be live again.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: the tag must be the version this repository claims
        shell: bash
        run: |
          set -euo pipefail

          # A missing VERSION is a failure, never "nothing to check". The whole
          # point of this job is to be the thing that cannot be skipped, and a
          # gate that opens when its input disappears is not a gate.
          if [ ! -f VERSION ]; then
            echo "::error::VERSION is missing from the repository root. This job compares"
            echo "::error::the release tag against it and refuses to guess when it is absent."
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION reads '$version', which is not MAJOR.MINOR.PATCH."
            echo "::error::core/version.Parse takes exactly three numeric components and"
            echo "::error::core/version.Current() panics on anything else."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "VERSION is $version and well formed. Not a tag run, so there is no tag to compare it with."
            exit 0
          fi

          # One leading v is tolerated on the tag and nothing else is: the
          # comparison is exact against a file that is bare MAJOR.MINOR.PATCH.
          #
          # A consequence worth knowing rather than discovering: while VERSION
          # is bare, a pre-release tag (v1.0.0-rc1) cannot pass this, so the
          # --prerelease path in publish is presently unreachable. That is the
          # two checks agreeing rather than an oversight - ci.yml's copy would
          # refuse the same tag - and it is what to revisit if release
          # candidates are ever wanted.
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not the version this repository claims."
            echo "::error::VERSION says $version. Nothing was built and no release was created."
            echo "::error::Either the tag is wrong, or VERSION was not bumped in the commit it points at."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches VERSION ($version)"

      # Where the tag POINTS (bacchus-vpn/bacchus#151). The step above checks
      # what it says.
      #
      # verify-table's comment below sets out why this workflow re-runs ONE test
      # rather than the suite: every other assertion in this repository is a
      # function of the tree, so ci.yml's run on the pull request that merged
      # those bytes is durable evidence about them, and only what expires with
      # the calendar has to be re-asserted at release time. That argument is
      # sound exactly to the extent that the tagged commit went through a pull
      # request - and until this step, nothing made it so. A tag pushed onto a
      # branch head, a local commit, or anything else main does not contain
      # built a bundle and drafted a release from a tree the test suite had
      # never seen, with every job in this file green over it. The evidence the
      # release rests on was assumed rather than established.
      #
      # THE POLICY IS main-ONLY, ruled 2026-08-04: a release is cut from main or
      # it is not cut. That forbids a hotfix cut from a branch, deliberately.
      # The alternative was asserting a green ci.yml run for the SHA through the
      # check-suites API, which permits hotfix branches and needs a policy for a
      # run still in progress - more intricate, and the intricacy would sit in
      # the one workflow that must not be wrong. If a hotfix from a branch is
      # ever wanted, that is a deliberate change to this policy and to this
      # step, not a flag to reach for at the moment somebody needs one.
      #
      # ANCESTRY IS ONLY AS GOOD AS THE HISTORY IN THE CLONE. The two guards
      # below are why fetch-depth: 0 is on the checkout above, and they are
      # checked rather than assumed for the reason this job's VERSION check
      # already gives: a gate that opens - or refuses for the wrong reason -
      # when its input disappears is not a gate.
      #
      # A SEPARATE STEP rather than four more lines in the one above, because
      # the two failures are unrelated (a tag naming the wrong number; a tag on
      # the wrong commit) and a run should say which one happened in the step
      # name, before anybody opens the log.
      - name: the tagged commit must be one main contains
        shell: bash
        run: |
          set -euo pipefail

          # The full ref, never the bare "origin/main": this is the one
          # comparison in the file where resolving to something else would be
          # silent rather than loud.
          main_ref="refs/remotes/origin/main"

          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::this clone is shallow, so it cannot answer whether the tagged commit is"
            echo "::error::on main - git would report 'not an ancestor' about a commit that is one,"
            echo "::error::and refuse the release for a reason that is not the reason. Put"
            echo "::error::fetch-depth: 0 back on this job's actions/checkout step."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "$main_ref" >/dev/null; then
            echo "::error::$main_ref is not in this clone, so there is nothing to compare the"
            echo "::error::tagged commit against. actions/checkout fetches every branch only when"
            echo "::error::fetch-depth: 0 is set on it; on a tag push at the default depth it"
            echo "::error::fetches the tagged commit and nothing else."
            exit 1
          fi

          # The assertion at the foot of this step is release-only - no run on a
          # branch can reach it - so the machinery under it is exercised on
          # EVERY run, including the dry ones. Same reason as the version rule's
          # self-test in windows-bundle, and the same reason this file's header
          # gives for rehearsing the build half: a release-only path whose first
          # execution is a real release is the thing being avoided.
          #
          # One pair of real commits from the history just fetched tests both
          # directions, because a commit is never an ancestor of its own parent
          # and its parent always is one.
          #
          # It does NOT subsume the depth guard above and must not be read as
          # doing so - measured, a clone shallow at depth 20 passes both lines
          # below and still answers the real question wrong about a commit 55
          # back. What this pair covers is the other failure: merge-base itself
          # not returning what this step reads its exit status as.
          if ! git merge-base --is-ancestor "$main_ref~1" "$main_ref"; then
            echo "::error::git says main's own parent is not an ancestor of main. Either main is a"
            echo "::error::single root commit, or this clone's history is not what it appears to"
            echo "::error::be, or merge-base is not behaving as this step assumes. The assertion"
            echo "::error::below would mean nothing, so it is not run."
            exit 1
          fi
          if git merge-base --is-ancestor "$main_ref" "$main_ref~1"; then
            echo "::error::git says main is an ancestor of its own parent, so the REFUSAL half of"
            echo "::error::this check does not work and it would admit any commit at all. Nothing"
            echo "::error::below is trustworthy."
            exit 1
          fi
          echo "ancestry answers both ways against $(git rev-parse --short "$main_ref") (main)"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag run, so there is no release commit to place on main."
            exit 0
          fi

          # ^{commit} rather than the bare value. Not a correctness fix -
          # merge-base peels a tag object on its own, checked against git 2.53 -
          # but a push of an ANNOTATED tag can put a tag object's hash here, and
          # a refusal that prints one sends the reader looking up an object that
          # is not the tree that would have shipped. --verify also turns a SHA
          # missing from the clone into a failure here rather than an unrelated
          # error out of merge-base.
          sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" "$main_ref"; then
            echo "::error::tag ${GITHUB_REF_NAME} points at $sha, which is not on main."
            echo "::error::Nothing was built and no release was created."
            echo "::error::"
            echo "::error::WHY THIS IS REFUSED, because the rule outlives whoever hits it: nothing"
            echo "::error::re-runs the test suite at release time. This workflow re-asserts only"
            echo "::error::what expires with the calendar - the age of the shipped IP->AS table -"
            echo "::error::because every other assertion here is a function of the tree, and"
            echo "::error::ci.yml's run on the pull request that merged those bytes is durable"
            echo "::error::evidence about them. A commit main does not contain went through no"
            echo "::error::pull request, so no such run exists and there is no evidence to inherit."
            echo "::error::The tree this release would ship has been tested by nothing at all."
            echo "::error::"
            echo "::error::A release is cut from main or it is not cut (ADR-0044, #151). Merge the"
            echo "::error::work and tag the commit on main. A hotfix cut from a branch is a change"
            echo "::error::to that policy and to this step, not something to work around here."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} points at $sha, which main contains"

  # The second gate (bacchus-vpn/bacchus#66): a release must not be cut on a
  # stale IP->AS table.
  #
  # core/asn/table.tsv.gz is COMMITTED and embedded in the client binary
  # (ADR-0044's first amendment), so the table a user scores relay-chain AS
  # diversity against, for the whole life of an install, is the one that was in
  # the tree when the release was built. There is deliberately no fetch - a
  # periodic table fetch from every client is precisely the predictable,
  # fingerprintable request the transport spends its entire budget avoiding -
  # which leaves cutting a release as the only moment the table can be
  # corrected. That is what "refreshed per release" means, and until this job
  # existed nothing enforced it.
  #
  # WHY HERE AND NOT IN ci.yml, where TestEmbeddedTableIsFresh has run since
  # bacchus-vpn/bacchus#55. On a tag push ci.yml and this file are started by
  # the same event and run CONCURRENTLY, and there is no native way to order
  # them - the same finding verify-version's comment above records about the
  # version assertion, arrived at from a different direction. So ci.yml's copy
  # is a BYSTANDER: it can go red beside a bundle that has already been built
  # and a release that has already been created.
  #
  # On one tag spelling it is worse than a bystander. This workflow triggers on
  # 'v[0-9]*' AND '[0-9]*'; ci.yml triggers on 'v*'. A tag pushed as 1.0.0
  # rather than v1.0.0 starts this workflow and does not start ci.yml at all, so
  # on that spelling the freshness check does not run anywhere, in parallel or
  # otherwise.
  #
  # WHAT THIS JOB DELIBERATELY IS NOT is a second copy of the test suite.
  # "It duplicates ci.yml" is not an argument against it - a parallel ci.yml
  # gates nothing, which is the entire finding - so the reason to stop at the
  # table is a different one. Every other test in this repository is a function
  # of the tree, and ci.yml's run on the pull request that merged those bytes is
  # durable evidence about them. TestEmbeddedTableIsFresh is the one assertion
  # whose verdict changes with the CALENDAR rather than with the tree: it
  # compares core/asn.TableRetrieved against today, so a tree that passed it on
  # the day it merged fails it on day 91 with nothing having changed. What has
  # to be re-asserted at the moment of release is what expires. Re-asserting the
  # rest would mean a second copy of ci.yml's server job apparatus - user
  # namespaces, nftables, sysctls - which would rot unnoticed because release
  # runs are rare, and whose half-copy would SKIP the kernel tests and report
  # green over them.
  #
  # The residual this job used to name - that nothing checked whether the tagged
  # commit was one ci.yml ever saw, so "durable evidence about those bytes" was
  # an assumption rather than a fact - is closed. verify-version's second step
  # asserts the tagged commit is on main (bacchus-vpn/bacchus#151), which is
  # what makes the paragraph above an argument rather than a hope. It sits in
  # that job rather than this one because it is a property of the tag, not of
  # the table, and the two gates stay split along that line.
  verify-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go.mod rather than `stable`, for the reason windows-bundle gives below:
      # a release asks "check it with the toolchain this repo declares".
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `go test -run` matching NOTHING exits 0, and so does `go test` on a
      # package whose assertion has been deleted. This repository has been
      # bitten by that exact class once already - a -ldflags -X naming a symbol
      # the linker cannot resolve is ignored silently with a zero exit, which is
      # why ci.yml's release-stamp job reads the value back out of the binary
      # rather than trusting that the flag was passed. So the existence of the
      # assertion is checked here rather than assumed, and the step below runs
      # the whole package instead of a -run filter that could match nothing.
      #
      # The other half of this belt is in Go and runs on every ordinary pull
      # request: core/asn.TestReleaseWorkflowGatesTheTable asserts that this job
      # exists, that it sets the environment variable below, and that
      # windows-bundle needs it. ci.yml gates merges, so the workflow that gates
      # merges is what guards the workflow that gates releases.
      - name: the freshness assertion exists
        run: |
          set -euo pipefail
          listed=$(go test -list 'TestEmbeddedTableIsFresh' ./core/asn/ | grep -c '^TestEmbeddedTableIsFresh$' || true)
          if [ "$listed" != "1" ]; then
            echo "::error::core/asn has no TestEmbeddedTableIsFresh. This job runs that package to"
            echo "::error::assert the shipped IP->AS table is fresh enough to release; with the test"
            echo "::error::gone the run would be green over nothing, which is the failure this step"
            echo "::error::exists to make impossible."
            exit 1
          fi
          echo "TestEmbeddedTableIsFresh is present"
      # BACCHUS_ASN_RELEASE_TABLE turns the 90-day build floor into the 30-day
      # release bar. Same shape and the same reason as BACCHUS_REQUIRE_STAMP and
      # BACCHUS_NETD_REQUIRE_NS in ci.yml: an assertion that is inert by default
      # and made mandatory by the one job that needs it. The bar cannot simply
      # apply everywhere - at 30 days it would block every unrelated pull
      # request one month after a refresh instead of one quarter - and it cannot
      # be a warning, because a warning on a rare run is indistinguishable from
      # no check at all.
      #
      # THIS APPLIES ON DRY RUNS TOO, not only on a tag, and that is deliberate.
      # This file's header argues that the release-only paths are the dangerous
      # ones precisely because nothing rehearses them; a bar whose refusal first
      # executes during a real release is that mistake again. A pull request
      # that touches the release path is a pull request about cutting releases,
      # and it should not be green if a release could not be cut from it.
      #
      # -v so the retrieval date and the age this job passed or failed on land
      # in the log. Five tests in the package; the noise buys a run that is
      # answerable from its own output.
      - name: the table this release would ship is fresh enough to ship
        env:
          BACCHUS_ASN_RELEASE_TABLE: "1"
        run: go test -count=1 -v ./core/asn/

  # The fleet binaries, built REPRODUCIBLY, and the artifact rows the offline
  # signer turns into a manifest (bacchus-vpn/bacchus#34, ADR-0052 section 5,
  # ADR-0065).
  #
  # ADR-0052 measured the reproducibility claim rather than asserting it:
  # cmd/coordinator built twice with -trimpath and CGO_ENABLED=0 from two
  # different source directories is byte-identical, and WITHOUT -trimpath the
  # same two builds differ, with the absolute source path appearing in the
  # binary 839 times. This job is what turns that measurement into a property
  # something enforces. It builds every fleet binary TWICE, from two different
  # paths, and refuses the release if any pair differs.
  #
  # Why build twice here rather than trust the flags: a reproducibility claim
  # whose only evidence is that the right flags were passed is a claim that
  # stops holding the first time a dependency starts embedding a path, a date
  # or a hostname, and nothing would say so. The whole point of the property is
  # that an INDEPENDENT rebuilder can confirm a release; a build that cannot
  # reproduce itself on one machine will not reproduce on theirs.
  #
  # WHAT THIS JOB DOES NOT DO IS SIGN. ADR-0052 section 6: the update key never
  # sits on a build machine and CI never holds it, because a build machine that
  # can sign is a build machine that can push code to every node. This produces
  # artifacts.json - os/arch/role/size/sha256 rows - and the signing is a
  # separate, deliberate act performed OFFLINE on what this produced
  # (cmd/release-sign).
  #
  # clients/fyne is deliberately absent from the reproducibility check and
  # present in the rows: it needs cgo and a C toolchain, so reproducing it means
  # pinning an entire mingw-w64 sysroot, which ADR-0052 section 5 records as a
  # recorded NO rather than a deferral. Its hash is taken from the one
  # designated build, in windows-bundle below.
  fleet-binaries:
    needs: [verify-version, verify-table]
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semver.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
      # go.mod, not `stable`. ADR-0052 section 5 wants a PINNED toolchain for
      # the release build, because the toolchain is an input to the output and
      # an unpinned one makes the property untestable.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: derive the version
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            semver="${GITHUB_REF_NAME#v}"
            semver="${semver%%-*}"
          else
            # A dry run. 0.0.0 parses, which keeps the stamping path exercised
            # rather than skipped - the same choice windows-bundle makes.
            semver="0.0.0"
          fi
          echo "semver=$semver" | tee -a "$GITHUB_OUTPUT"

      # Two builds of the same source at two different absolute paths. The
      # second location is what makes -trimpath's absence VISIBLE: without it
      # the source path is baked in, so two trees at one path would agree and
      # prove nothing.
      - name: build the fleet binaries twice, from two different paths
        shell: bash
        env:
          CGO_ENABLED: "0"
          SEMVER: ${{ steps.semver.outputs.semver }}
        run: |
          set -euo pipefail
          # cmd dir -> installed name, which is what deploy/install.sh puts on
          # disk and therefore what an update replaces. Spelled out rather than
          # prefixed, because "bacchus-" + "bacchus-netd" is a name nothing
          # installs.
          build() {
            local src="$1" out="$2"
            mkdir -p "$out"
            for pair in node:bacchus-node coordinator:bacchus-coordinator bacchus-netd:bacchus-netd; do
              local cmd="${pair%%:*}" name="${pair##*:}"
              (cd "$src" && go build -trimpath \
                -ldflags "-X github.com/bacchus-vpn/bacchus/core/version.current=$SEMVER" \
                -o "$out/$name" "./cmd/$cmd")
            done
          }
          # The second tree is a copy at an unrelated path, which is exactly the
          # measurement ADR-0052 section 5 describes.
          cp -a "$GITHUB_WORKSPACE" /tmp/bacchus-rebuild
          build "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dist-fleet/a"
          build /tmp/bacchus-rebuild "$GITHUB_WORKSPACE/dist-fleet/b"

      - name: the two builds must be byte-identical
        shell: bash
        run: |
          set -euo pipefail
          differ=0
          for f in dist-fleet/a/*; do
            name="$(basename "$f")"
            ha="$(sha256sum "$f" | cut -d' ' -f1)"
            hb="$(sha256sum "dist-fleet/b/$name" | cut -d' ' -f1)"
            if [ "$ha" != "$hb" ]; then
              echo "::error::$name is NOT reproducible: $ha from one source path, $hb from another."
              echo "::error::ADR-0052 section 5 commits the fleet binaries to being byte-identical"
              echo "::error::across source directories with -trimpath and CGO_ENABLED=0. Something in"
              echo "::error::this build now embeds its environment - a path, a date, a hostname."
              echo "::error::An independent rebuilder cannot confirm this release, which is the whole"
              echo "::error::property, so the release is refused rather than shipped with the claim"
              echo "::error::quietly false."
              differ=1
            else
              echo "$name reproducible: $ha"
            fi
          done
          [ "$differ" = "0" ]

      # The stamp is read back OUT OF THE BINARY rather than trusted. A
      # -ldflags -X naming a symbol the linker cannot resolve is ignored
      # SILENTLY, with a zero exit; ci.yml's release-stamp job exists for that
      # reason and this is the same belt on the release path. An unstamped fleet
      # binary reports 0.0.0 into the version fence, which is below any floor.
      #
      # WHICH BINARIES THIS APPLIES TO IS DERIVED, NOT LISTED, and the reason is
      # a live example rather than a hypothetical: until bacchus-vpn/bacchus#223,
      # cmd/bacchus-netd did not link core/version at all - `go list -deps
      # ./cmd/bacchus-netd` did not contain it - so the -X above was silently
      # ignored for that binary and no amount of checking the build log would
      # have said so. Asserting a stamp a binary cannot carry would refuse every
      # release; not asserting the others would be the trap this step exists for.
      # So the dependency decides. All three link it today, and a binary that
      # gains or loses the package starts or stops being asserted on its own.
      #
      # HOW THE VALUE IS READ, and why not the three obvious ways
      # (bacchus-vpn/bacchus#254):
      #
      #   - NOT `strings -a | grep -qx`, which is what this step used to do. That
      #     asks whether the value occupies a WHOLE LINE of `strings` output, and
      #     Go packs its strings contiguously into one blob with no separators,
      #     so whether any given value lands on a line of its own is an accident
      #     of what happens to sit beside it. It went red on a correctly stamped
      #     bacchus-netd, whose blob reads "...48828125infinityClassANY..."
      #     through that region. Worse, and measured rather than feared: it goes
      #     GREEN on a bacchus-node and a bacchus-coordinator built with no -X at
      #     all, because core/version's own source carries the literal 0.0.0 it
      #     reports when nothing stamped it - and a dry run asserts exactly
      #     0.0.0. A false pass on the precise defect the step exists to catch.
      #   - NOT `go version -m`. Under -trimpath, which ADR-0052 section 5
      #     requires for the fleet build, it records no -ldflags at all. WITHOUT
      #     -trimpath it records the flag STRING that was passed - byte for byte
      #     the same whether or not the linker resolved the symbol - which is the
      #     value this step must never take on trust.
      #   - NOT running the binary. Only bacchus-netd has a -version flag, and
      #     even it cannot settle a dry run: 0.0.0 is what an UNSTAMPED build
      #     reports too, so an execution read-back agrees with itself on a
      #     release whose stamp never landed.
      #
      # core/update.TestReleaseArtifactsCarryTheStamp decodes the Go string
      # header at core/version.current out of the artifact's own bytes - the same
      # indirection the runtime follows to answer version.Current(). A stamped
      # 0.0.0 and an unstamped build report the same NUMBER but are not the same
      # BYTES: the second has an empty string there, and that is the difference
      # no value comparison can see. The reader is covered by tests that run on
      # every pull request, which is more than the shell one-liner it replaces
      # ever had - nothing on a branch exercises this file's tag path.
      - name: the binaries that can state their release must state it
        shell: bash
        env:
          SEMVER: ${{ steps.semver.outputs.semver }}
        run: |
          set -euo pipefail
          artifacts=""
          for pair in node:bacchus-node coordinator:bacchus-coordinator bacchus-netd:bacchus-netd; do
            cmd="${pair%%:*}"; name="${pair##*:}"
            if ! go list -deps "./cmd/$cmd" | grep -qx 'github.com/bacchus-vpn/bacchus/core/version'; then
              echo "$name does not link core/version, so it carries no release stamp and none is asserted"
              continue
            fi
            # ABSOLUTE. `go test` runs the test binary with the package
            # directory as its working directory, so a path relative to the
            # workspace would resolve under core/update and read nothing.
            artifacts="$artifacts $GITHUB_WORKSPACE/dist-fleet/a/$name"
          done
          if [ -z "$artifacts" ]; then
            echo "::error::no fleet binary links core/version, so this step would assert nothing at"
            echo "::error::all and report success over it. Either every one of them lost the package,"
            echo "::error::or the derivation above stopped matching what the build step produced."
            exit 1
          fi

          # `go test -run` matching NOTHING exits 0, so a renamed or deleted test
          # disables this gate without failing it - the same shape as the ignored
          # -X the gate is about. verify-table checks the existence of its
          # assertion for exactly this reason; so does this.
          listed=$(go test -list 'TestReleaseArtifactsCarryTheStamp' ./core/update/ | grep -c '^TestReleaseArtifactsCarryTheStamp$' || true)
          if [ "$listed" != "1" ]; then
            echo "::error::core/update has no TestReleaseArtifactsCarryTheStamp. That test is what reads"
            echo "::error::the release stamp back out of the built artifacts; without it this step would"
            echo "::error::be green over nothing, which is the failure it exists to make impossible."
            exit 1
          fi

          # BACCHUS_RELEASE_STAMP is what makes the assertion load-bearing: the
          # test SKIPS without it, because on an ordinary run there are no
          # artifacts to read. Same shape, and the same reason, as
          # BACCHUS_ASN_RELEASE_TABLE above and BACCHUS_REQUIRE_STAMP in ci.yml.
          BACCHUS_RELEASE_STAMP="$SEMVER" BACCHUS_RELEASE_ARTIFACTS="$artifacts" \
            go test -count=1 -v -run 'TestReleaseArtifactsCarryTheStamp' ./core/update/

          # CALIBRATION, not the gate, and the distinction is the point. The gate
          # above reads bytes; this asks the one fleet binary that can answer for
          # itself (bacchus-netd -version, bacchus-vpn/bacchus#223) and requires
          # the two to agree. That is what makes the reader answerable for the
          # other two, which have no such flag and are trusted to it.
          #
          # It can be asked at all only because this job builds for the runner's
          # own platform - no GOOS/GOARCH above, and artifacts.json below says
          # linux/amd64. A cross-compiled fleet would keep the gate and lose this.
          if ! spoken="$(./dist-fleet/a/bacchus-netd -version)"; then
            echo "::error::bacchus-netd -version did not run on the machine that built it. The gate"
            echo "::error::above already read the stamp out of its bytes; this step asks the binary"
            echo "::error::itself, which is what makes that reader trustworthy for the binaries that"
            echo "::error::cannot be asked."
            exit 1
          fi
          if [ "$spoken" != "$SEMVER" ]; then
            echo "::error::bacchus-netd reports release '$spoken' and this release is '$SEMVER', so the"
            echo "::error::value read out of the artifact's bytes and the value the artifact states are"
            echo "::error::not the same value. One of the two is wrong and neither can be preferred."
            exit 1
          fi
          echo "bacchus-netd states $spoken, which is what its bytes carry"

      # The rows the OFFLINE signer reads (cmd/release-sign plan -from). This is
      # the whole handover between CI and the signing ceremony: hashes and
      # sizes, no key, no signature, no URL. The manifest names hashes and never
      # locations (ADR-0052 section 1), so nothing here needs to know where the
      # bytes will be published.
      - name: the artifact rows for the offline signer
        shell: bash
        env:
          SEMVER: ${{ steps.semver.outputs.semver }}
        run: |
          set -euo pipefail
          mkdir -p dist-fleet/blobs
          {
            printf '{\n  "release": "%s",\n  "artifacts": [\n' "$SEMVER"
            first=1
            for f in dist-fleet/a/*; do
              case "$(basename "$f")" in
                bacchus-node)        role=node ;;
                bacchus-coordinator) role=coordinator ;;
                bacchus-netd)        role=netd ;;
                # core/update's roles are a CLOSED vocabulary, checked at
                # verification: a manifest row naming a role a peer does not know
                # is refused, not skipped. So a new binary here is a deliberate
                # change in both places, and this refuses rather than invents one.
                *) echo "::error::no manifest role for $(basename "$f") - add it to core/update's Role constants first"; exit 1 ;;
              esac
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              size="$(stat -c%s "$f")"
              [ "$first" = "1" ] || printf ',\n'
              first=0
              printf '    {"os": "linux", "arch": "amd64", "role": "%s", "size": %s, "sha256": "%s"}' "$role" "$size" "$sum"
              # Published under the digest, because that is the only name a
              # content-addressed source has. A mirror holding several releases
              # needs no per-release layout and shares a blob two releases have
              # in common.
              cp "$f" "dist-fleet/blobs/$sum"
            done
            printf '\n  ]\n}\n'
          } > dist-fleet/artifacts.json
          cat dist-fleet/artifacts.json

      - name: upload the fleet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-fleet
          path: |
            dist-fleet/a/*
            dist-fleet/blobs/*
            dist-fleet/artifacts.json
          if-no-files-found: error

  windows-bundle:
    # Both gates, not one. They are independent assertions - the tag against
    # VERSION, and the shipped table against the calendar - so they run in
    # parallel with each other, and what matters is that neither can be
    # overtaken by the build.
    needs: [verify-version, verify-table]
    runs-on: windows-latest
    # Read by the publish job below. A job's steps' outputs are not visible to
    # another job unless they are re-exported here.
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      # Pinned, not inherited. clients/fyne is the only package in this repo
      # that needs a C toolchain (Fyne's desktop driver renders through OpenGL
      # via cgo - ADR-0039), and CGO_ENABLED=0 does not announce itself as a
      # missing compiler: go-gl's files drop out on a build constraint and the
      # error names a package no reader connects to the cause.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # go.mod rather than `stable`, which is what ci.yml uses. The difference
      # is deliberate: ci.yml asks "does this still build on the current Go",
      # and a release asks "build it with the toolchain this repo declares".
      # ADR-0052 section 5 wants a pinned toolchain version for the release
      # build for the same reason.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same find-or-install as ci.yml's windows-fyne-client job, for the same
      # reason it gives: these runner images move mingw between releases and
      # the image is not something this repo pins. As of 2026-08-02
      # windows-latest ships one on PATH already.
      - name: ensure a mingw-w64 gcc
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            "gcc already on PATH: $((Get-Command gcc).Source)"
            exit 0
          }
          $dirs = @(
            "C:\msys64\mingw64\bin",
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          )
          $dir = $dirs | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if ($dir) {
            "preinstalled toolchain at $dir"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            exit 0
          }
          "no preinstalled mingw-w64 on this image; installing one"
          choco install mingw --no-progress --yes

      - name: confirm the toolchain
        shell: pwsh
        run: |
          gcc --version
          if ($LASTEXITCODE -ne 0) { throw "no working mingw-w64 gcc on PATH - see the step above" }
          $cgo = go env CGO_ENABLED
          if ($cgo -ne "1") { throw "CGO_ENABLED=$cgo - a release built at 0 would not link the GL stack" }
          "CGO_ENABLED=$cgo CC=$(go env CC) go=$(go version)"

      # windows-latest has shipped Inno Setup for years, but that is an image
      # detail nobody here controls, and its disappearance should cost one step
      # rather than a red release nobody can read.
      - name: ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            "iscc already on PATH: $((Get-Command iscc).Source)"
            exit 0
          }
          $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($found) {
            "preinstalled Inno Setup at $found"
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $found)
            exit 0
          }
          "no preinstalled Inno Setup on this image; installing one"
          choco install innosetup --no-progress --yes
          $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $found) { throw "Inno Setup still not found after installing it" }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $found)

      # The version comes from the git TAG and from nothing else. Not from a
      # file in the tree: a release is the tag, and a file that disagrees with
      # it is a second source of truth to keep in step.
      #
      # Two values fall out, and they are not the same value:
      #
      #   version - the display form, used in file names and in the installer's
      #             Programs-and-Features entry. May carry a pre-release
      #             suffix (1.0.0-rc1).
      #   semver  - the bare MAJOR.MINOR.PATCH stamped into the binary through
      #             core/version.current. core/version.Parse takes exactly
      #             three numeric components and Current() PANICS on anything
      #             else, so a tag this cannot read must fail the release here,
      #             loudly, rather than produce a client that dies at its first
      #             connect.
      - name: derive the version from the tag
        id: version
        shell: pwsh
        run: |
          function Get-ReleaseVersion {
            param([Parameter(Mandatory)] [string] $Tag)
            $version = $Tag -replace '^v', ''
            # Anchored at both ends of the numeric head: "1.2.3" or a
            # pre-release "1.2.3-rc1", and nothing else. Semver build metadata
            # ("1.2.3+ci") is deliberately rejected rather than mangled - it is
            # not usable in the file names these artifacts get.
            $m = [regex]::Match($version, '^(\d+\.\d+\.\d+)($|-)')
            if (-not $m.Success) {
              throw "tag '$Tag' is not MAJOR.MINOR.PATCH[-prerelease]; core/version cannot be stamped from it"
            }
            $semver = $m.Groups[1].Value
            [pscustomobject]@{ Version = $version; SemVer = $semver; Prerelease = ($version -ne $semver) }
          }

          # The tag path above cannot be reached by any run on a branch, so it
          # is exercised here instead, on every run including the dry ones.
          # This is the only release-only logic in this file with a wrong answer
          # that is not obviously wrong: a mis-stamped core/version does not
          # fail the build, it ships a client that panics at its first connect
          # or lies to the coordinator about which release it is.
          $cases = @(
            @{ Tag = 'v1.2.3';     Version = '1.2.3';     SemVer = '1.2.3';    Prerelease = $false },
            @{ Tag = '1.2.3';      Version = '1.2.3';     SemVer = '1.2.3';    Prerelease = $false },
            @{ Tag = 'v1.0.0-rc1'; Version = '1.0.0-rc1'; SemVer = '1.0.0';    Prerelease = $true  },
            @{ Tag = 'v10.20.30';  Version = '10.20.30';  SemVer = '10.20.30'; Prerelease = $false }
          )
          foreach ($c in $cases) {
            $r = Get-ReleaseVersion -Tag $c.Tag
            if ($r.Version -ne $c.Version -or $r.SemVer -ne $c.SemVer -or $r.Prerelease -ne $c.Prerelease) {
              throw "tag '$($c.Tag)' read as $($r.Version)/$($r.SemVer)/$($r.Prerelease), wanted $($c.Version)/$($c.SemVer)/$($c.Prerelease)"
            }
          }
          foreach ($bad in @('nightly', 'v1.2', 'v1.2.3.4', 'release-1.0.0', '1.2.3+ci')) {
            $rejected = $false
            try { Get-ReleaseVersion -Tag $bad | Out-Null } catch { $rejected = $true }
            if (-not $rejected) { throw "the version rule accepted '$bad', which core/version cannot be stamped from" }
          }
          "version rule checked against $($cases.Count) tags it must accept and 5 it must reject"

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $r = Get-ReleaseVersion -Tag $env:GITHUB_REF_NAME
            $version = $r.Version
            $semver = $r.SemVer
            $prerelease = if ($r.Prerelease) { 'true' } else { 'false' }
          } else {
            # A dry run. Nothing is published, so the number only has to be
            # legible and valid; 0.0.0 parses, which keeps the stamping path
            # itself exercised rather than skipped.
            $version = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
            $semver = '0.0.0'
            $prerelease = 'true'
          }
          # Tee rather than a bare redirect: the values end up in the job log
          # too, which is where anyone reading a release run looks first.
          "version=$version"       | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          "semver=$semver"         | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

      - name: build the zip and the installer
        shell: pwsh
        run: |
          ./deploy/windows/build-bundle.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -SemVer '${{ steps.version.outputs.semver }}' `
            -OutDir dist

      # The client's artifact row for the signed release channel
      # (bacchus-vpn/bacchus#34, ADR-0065). The update path replaces the BINARY
      # at the installed path, so the artifact is the bare bacchus-fyne.exe -
      # not the zip and not the installer, neither of which is a thing a running
      # client can rename into place.
      #
      # THE STAGED PATH IS A COUPLING TO deploy/windows/build-bundle.ps1, which
      # owns the layout and is not this file's to change. It is read rather than
      # recomputed, and a missing one fails HERE with a sentence naming the
      # coupling, so the day that script reorganises its staging directory the
      # failure is one line to fix rather than a mystery.
      #
      # No hash is signed here and no key is present: this produces rows, and
      # signing is an offline act performed on them (ADR-0052 section 6).
      - name: the client artifact row for the release channel
        shell: pwsh
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          $staged = "dist/stage/bacchus-fyne-${{ steps.version.outputs.version }}-windows-amd64/bacchus-fyne.exe"
          if (-not (Test-Path $staged)) {
            throw "no staged client at $staged. deploy/windows/build-bundle.ps1 owns that layout (StageRoot/BundleName) and this step reads it to take the client's hash for the signed release channel. If the staging layout moved, this path moves with it."
          }
          $hash = (Get-FileHash $staged -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $staged).Length
          New-Item -ItemType Directory -Force -Path dist/blobs | Out-Null
          Copy-Item $staged "dist/blobs/$hash"
          $row = @{
            release   = $env:SEMVER
            artifacts = @(@{ os = "windows"; arch = "amd64"; role = "client"; size = $size; sha256 = $hash })
          }
          $row | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dist/artifacts-windows.json
          Get-Content dist/artifacts-windows.json

      # What the release actually contains, in the log, so a run is answerable
      # from its own output.
      - name: what was produced
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Format-Table Name, Length -AutoSize
          Get-Content dist/SHA256SUMS.txt

      - name: upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          # The staging and download directories under dist/ are inputs, not
          # outputs; only the published files and the release-channel rows go up.
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/artifacts-windows.json
            dist/blobs/*
          if-no-files-found: error

  publish:
    needs: [windows-bundle, fleet-binaries]
    # Only a tag PUSH publishes. A manual dispatch is always a dry run, even
    # when dispatched from a tag, because "I wanted to see if it builds" must
    # not be able to mint a release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # The only privileged step in this file, in the only job that needs it.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.windows-bundle.outputs.version }}
      PRERELEASE: ${{ needs.windows-bundle.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-bundle
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: linux-fleet
          path: fleet

      # One artifacts.json for the whole release, which is what the offline
      # signer reads (`release-sign plan -from`). The two halves are produced on
      # different runners and neither can see the other's, so they are joined
      # here - the last point before a human takes over.
      #
      # The release string must AGREE across the two. It is derived from the tag
      # in both jobs, so a disagreement means one of those derivations changed
      # and the manifest would name a release half its artifacts are not.
      - name: join the artifact rows
        run: |
          set -euo pipefail
          lin="$(jq -r .release fleet/artifacts.json)"
          win="$(jq -r .release dist/artifacts-windows.json)"
          if [ "$lin" != "$win" ]; then
            echo "::error::the fleet job says release $lin and the Windows job says $win."
            echo "::error::One manifest cannot describe two releases, and a manifest naming a"
            echo "::error::release half its artifacts are not is a release nobody can apply."
            exit 1
          fi
          jq -s '{release: .[0].release, artifacts: (map(.artifacts) | add)}' \
            fleet/artifacts.json dist/artifacts-windows.json > artifacts.json
          cat artifacts.json

      - name: write the release notes
        run: |
          cat > notes.md <<'EOF'
          Bacchus for Windows. Two artifacts, one build:

          - **`.zip` - portable, and the one to reach for first.** Unzip it
            anywhere and run `bacchus-fyne.exe` as Administrator. Nothing is
            installed, nothing is registered, and there is nothing to
            uninstall - delete the folder and it is gone. It runs from a USB
            stick. `README.en.txt` / `README.ru.txt` inside it are the first
            thing to read.
          - **`-setup-...exe` - the installer**, for a Start menu entry, an
            uninstaller and a normal-looking install.

          Both carry `wintun.dll` (the tunnel driver, redistributed unmodified
          from wintun.net) beside the client, so nothing has to be fetched from
          a third-party host to make a connection work.

          **Both are unsigned**, so Windows shows "Windows protected your PC" -
          choose More info, then Run anyway. Code signing is tracked separately
          and is not done yet.

          Check what you downloaded against `SHA256SUMS.txt`, ideally obtained
          by a different route than the files:

          ```
          Get-FileHash .\<file> -Algorithm SHA256
          ```

          ---

          **For the signed release channel** (`#34`), this draft also carries
          the Linux fleet binaries, the bare client executable, and
          `artifacts.json`. Those are inputs to the signing ceremony and not
          things to install by hand:

          - the fleet binaries are built `-trimpath`, `CGO_ENABLED=0`, on the
            toolchain `go.mod` pins, and this run **rebuilt each of them from a
            second source path and confirmed both were byte-identical**. Anyone
            may repeat that and get the same hashes.
          - `artifacts.json` holds the `os/arch/role/size/sha256` rows. Nothing
            here is signed: the update key never touches a build machine, so
            signing is a separate offline act performed on these rows
            (`release-sign plan -from artifacts.json`, then `release-sign sign`).
          - the blobs are named by their own digest, which is the only name a
            content-addressed source has.
          EOF
          cat notes.md

      # gh rather than a third-party action: it is preinstalled on the runner,
      # and the one job in this file that can write to the repository should
      # depend on as little as possible.
      #
      # DRAFT on purpose. This job's first real execution is a real release -
      # no run on a branch can reach it - so it lands somewhere a human looks
      # at it before anyone can download it. It is also the shape ADR-0052
      # section 6 asks for: signing is a deliberate act performed on artifacts
      # CI produced, never a step inside the pipeline that produced them, and a
      # draft is exactly where artifacts wait for that act.
      #
      # If this fails because the release already exists (a re-run), delete the
      # draft and run it again rather than reaching for --clobber here.
      - name: create the draft release
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag)
          # Through the environment, not interpolated into the script: nothing
          # here should be able to become shell just because a value changed.
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          # The Windows bundle, plus the release channel's inputs: the fleet
          # binaries, the artifact rows, and the blobs under their digests. A
          # DRAFT is where artifacts wait for the signing act (ADR-0052 section
          # 6), and #34 is what finally gives that sentence something to wait
          # for.
          gh release create "$GITHUB_REF_NAME" \
            "${flags[@]}" \
            --title "Bacchus $VERSION for Windows" \
            --notes-file notes.md \
            dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            artifacts.json fleet/a/*
          echo "draft release created for $GITHUB_REF_NAME - review it and publish by hand"
          echo "the manifest is NOT here: sign artifacts.json offline (cmd/release-sign) and publish"
          echo "manifest.json beside blobs/<digest> on whatever source the fleet is pointed at"
